<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FootSteps — Trail Invite</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0D0D0F;
            color: #EEEDFE;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            text-align: center;
            padding: 48px 32px;
            max-width: 380px;
        }
        .icon {
            width: 80px;
            height: 80px;
            background: #26215C;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 36px;
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #888;
            font-size: 15px;
            margin-bottom: 32px;
            line-height: 1.5;
        }
        .btn {
            display: inline-block;
            background: #7F77DD;
            color: #EEEDFE;
            padding: 14px 32px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.85; }
        .hint {
            color: #555;
            font-size: 12px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">👣</div>
        <h1>Trail Invite</h1>
        <p class="subtitle">
            Someone wants to connect with you on FootSteps.<br>
            Open this link on your iPhone to accept.
        </p>
        <a class="btn" id="openApp" href="#">Open FootSteps</a>
        <p class="hint">If the app doesn't open, make sure FootSteps is installed.</p>
    </div>

    <script>
        // Extract the invite data from the URL path
        const path = window.location.pathname;
        const parts = path.split('/').filter(Boolean);
        // URL format: /join/BASE64DATA
        const data = parts.length > 1 ? parts[parts.length - 1] : '';

        // Try custom scheme as fallback
        const deepLink = 'footsteps://join/' + data;
        document.getElementById('openApp').href = deepLink;

        // On iOS, Universal Links handle the redirect automatically.
        // This page only shows if the app isn't installed.
    </script>
</body>
</html>
