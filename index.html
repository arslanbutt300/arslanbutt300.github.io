<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FootSteps</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0D0D0F;
            color: #EEEDFE;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            text-align: center;
            padding: 48px 32px;
            max-width: 380px;
        }
        .icon {
            width: 80px;
            height: 80px;
            background: #26215C;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 36px;
        }
        h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
        .subtitle { color: #888; font-size: 15px; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">👣</div>
        <h1>FootSteps</h1>
        <p class="subtitle">GPS trail tracking with ghost navigation.<br>Record, replay, and share your trails.</p>
    </div>
</body>
</html>
