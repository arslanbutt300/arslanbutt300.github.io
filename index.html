<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arslan Ahmad — FootSteps</title>
    <meta name="description" content="FootSteps GPS trail tracking app by Arslan Ahmad.">
    <link rel="canonical" href="https://arslanbutt300.github.io/">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0D0D0F;
            color: #EEEDFE;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .wrap { text-align: center; padding: 48px 32px; max-width: 440px; }
        .icon {
            width: 80px; height: 80px; background: #26215C; border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 24px; font-size: 36px;
        }
        h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
        .subtitle { color: #888; font-size: 15px; line-height: 1.5; margin-bottom: 28px; }
        .projects { display: flex; flex-direction: column; gap: 10px; }
        .btn {
            display: block; padding: 12px 20px; border-radius: 10px;
            font-weight: 600; font-size: 14px; text-decoration: none; transition: opacity 0.15s;
        }
        .btn:hover { opacity: 0.85; }
        .btn-fs { background: #26215C; color: #EEEDFE; border: 1px solid #3d3875; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="icon">👣</div>
        <h1>Arslan Ahmad</h1>
        <p class="subtitle">iOS Developer · Building FootSteps</p>
        <div class="projects">
            <a class="btn btn-fs" href="https://apps.apple.com/app/footsteps" target="_blank" rel="noopener">👣 FootSteps — GPS Trail App</a>
        </div>
    </div>
</body>
</html>
